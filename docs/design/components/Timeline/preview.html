<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Timeline — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html, body { margin: 0; }
body { padding: 28px 32px; }
.demo { display: flex; flex-direction: column; gap: 22px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; }
.demo-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.demo-cap { font-size: 12px; letter-spacing: 0.08em; color: var(--ink-muted, #b29878); }

<body class="sd-root">
<div id="root" style="padding-top: 12px">

<li class="sd-timeline__item sd-timeline__item--now"><span class="sd-timeline__dot"></span><span class="sd-timeline__label">정기 활동</span><span class="sd-timeline__note">지금 · 격주 모임</span></li>
<li class="sd-timeline__item sd-timeline__item--next"><span class="sd-timeline__dot"></span><span class="sd-timeline__label">기수 마무리</span><span class="sd-timeline__note">기록 정리 · 다음 기수</span></li>

</div>
